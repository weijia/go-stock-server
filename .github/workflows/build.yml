name: Build All Targets

on:
  push:
    branches: [ master, main ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      skip_apk_gui:
        description: "跳过方案 C Fyne APK（慢，约 12 分钟）"
        required: false
        type: boolean
        default: false
      skip_apk_shell:
        description: "跳过方案 B Shell APK（约 8 分钟）"
        required: false
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION:   "1.25"       # go.mod 里已用的大版本
  JDK_VERSION:  "17"         # AGP 8.4 需要 JDK 17
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK_VERSION: "26.3.11579264"
  GOPROXY: "https://proxy.golang.org,direct"

jobs:

  ###########################################################################
  # Job 1 — 方案 A CLI 三平台 + go vet + HTTP smoke 门禁
  ###########################################################################
  cli:
    name: "CLI (方案A) + vet + smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Go mod download & vet (non-GUI packages)
        run: |
          set -e
          go mod download
          # 只 vet 非 Fyne 包（否则触发 CGO OpenGL 缺库）
          LIST=$(go list ./... | grep -v -E "cmd/android-gui")
          CGO_ENABLED=0 go vet $LIST

      - name: Build CLI binaries (方案A)
        run: |
          set -e
          mkdir -p build-out
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o build-out/go-stock-server-linux-amd64   ./cmd/server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o build-out/go-stock-server-windows-amd64.exe ./cmd/server
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o build-out/go-stock-server-android-arm64 ./cmd/server
          ls -lh build-out/

      - name: HTTP smoke (T1~T4 契约基线)
        run: |
          set -e
          go build -o /tmp/srv ./cmd/server
          /tmp/srv --db "" --host 127.0.0.1 --port 29700 > /tmp/srv.log 2>&1 & PID=$!
          sleep 3
          OUT=/tmp/snap.txt
          : > $OUT
          for t in "T1 /api/health" "T2 /api/config" "T3 /api/quote_cache"; do
            name=${t% *}; url=${t#* }
            echo "=== $name ===" >> $OUT
            curl -s --max-time 5 "http://127.0.0.1:29700$url" \
              | sed -E "s/\"timestamp\":\"[^\"]*\"/\"ts\":\"__\"/g; s/\"uptime_seconds\":[0-9]+/\"up\":0/g; s/\"start_time\":\"[^\"]*\"/\"st\":\"__\"/g" \
              >> $OUT; echo "" >> $OUT
          done
          echo "=== T4 ===" >> $OUT
          curl -s --max-time 5 -w "\nHTTP_STATUS:%{http_code}" \
            "http://127.0.0.1:29700/api/node/config" \
            | sed -E "s/\"timestamp\":\"[^\"]*\"/\"ts\":\"__\"/g" >> $OUT
          kill -SIGTERM $PID 2>/dev/null; wait $PID 2>/dev/null || true
          cat $OUT
          set +e
          grep -q "HTTP_STATUS:400" $OUT          && echo "✅ T4 400 X-Node-ID 正确"
          grep -q "\"code\":200" $OUT              && echo "✅ T1~T3 200 OK"

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: build-out/go-stock-server-*
          retention-days: 30

  ###########################################################################
  # Job 2 — 方案 B Shell APK
  ###########################################################################
  apk_shell:
    name: "Shell APK (方案B)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ !inputs.skip_apk_shell }}
    needs: cli
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Setup JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Setup Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708   # cmdline-tools 12 (2024)
          packages: >-
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Build Go arm64 binary & copy to Android raw
        run: |
          set -e
          mkdir -p android-app/app/src/main/res/raw build-out
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
            go build -ldflags="-s -w" -o build-out/go-stock-server-android-arm64 ./cmd/server
          cp build-out/go-stock-server-android-arm64 \
             android-app/app/src/main/res/raw/go_stock_server
          ls -lh android-app/app/src/main/res/raw/go_stock_server

      - name: Apply CI gradle.properties (no proxy)
        run: cp android-app/gradle.properties.ci android-app/gradle.properties

      - name: Gradle assembleDebug
        working-directory: android-app
        run: |
          set -e
          # 优先 wrapper，否则用 setup-gradle 装的 gradle
          CMD="gradle"
          [ -x ./gradlew ] && CMD="./gradlew"
          $CMD --no-daemon --no-watch-fs --warning-mode all app:assembleDebug 2>&1 | tail -60

      - name: Collect artifacts
        run: |
          mkdir -p build-out
          cp android-app/app/build/outputs/apk/debug/app-debug.apk build-out/StockServerShell-debug.apk
          ls -lh build-out/

      - name: Upload Shell APK
        uses: actions/upload-artifact@v4
        with:
          name: StockServerShell-debug
          path: build-out/StockServerShell-debug.apk
          retention-days: 90

  ###########################################################################
  # Job 3 — 方案 C Fyne GUI APK
  ###########################################################################
  apk_gui:
    name: "Fyne GUI APK (方案C)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ !inputs.skip_apk_gui }}
    needs: cli
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Setup JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >-
            platforms;android-34
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Install Fyne CLI
        run: |
          GOBIN=/usr/local/bin go install fyne.io/fyne/v2/cmd/fyne@v2.8.1
          fyne version

      - name: Generate GUI icon
        run: |
          # 生成 512x512 PNG（蓝色渐变占位）；项目自己有 icon 后可替换
          mkdir -p build-out
          cat > /tmp/genicon.go <<'GO'
          package main
          import ("image"; "image/color"; "image/png"; "os")
          func main() {
            sz := 512
            img := image.NewRGBA(image.Rect(0,0,sz,sz))
            for y:=0; y<sz; y++ {
              for x:=0; x<sz; x++ {
                r := uint8(51 + int(float32(x)/float32(sz)*85))
                img.Set(x,y,color.RGBA{r, 102, 170, 255})
              }
            }
            f,_ := os.Create(os.Args[1])
            defer f.Close()
            png.Encode(f, img)
          }
          GO
          go run /tmp/genicon.go build-out/gui_icon.png

      - name: Ensure gui_main.go in module root (for `fyne package .`)
        run: |
          [ -f gui_main.go ] || cp cmd/android-gui/main.go gui_main.go
          # 给 gui_main.go 加 android-only build tag，避免 go vet 把 Linux CGO 编进去
          head -1 gui_main.go | grep -q "^//go:build" || \
            sed -i '1i //go:build android || ignore_gui_main' gui_main.go

      - name: Fyne package -os android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: |
          set -e
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION
          [ -d "$ANDROID_NDK_HOME" ] || { echo "NDK 不存在"; ls $ANDROID_SDK_ROOT/ndk/; exit 1; }
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          unset CGO_ENABLED
          fyne package -os android \
            -appID com.stock.server.gui \
            -name  StockServerGUI \
            -icon  build-out/gui_icon.png \
            . 2>&1 | tail -40
          ls -lh StockServerGUI.apk
          mkdir -p build-out
          cp StockServerGUI.apk build-out/StockServerGUI-debug.apk

      - name: Upload Fyne GUI APK
        uses: actions/upload-artifact@v4
        with:
          name: StockServerGUI-debug
          path: build-out/StockServerGUI-debug.apk
          retention-days: 90

  ###########################################################################
  # Job 4 — 汇总发布（仅 tag）
  ###########################################################################
  release:
    name: "GitHub Release（仅 push tag v*）"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, apk_shell, apk_gui]
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-artifacts }
      - name: 扁平化 + 校验 SHA256
        run: |
          mkdir -p release
          find release-artifacts -type f -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt
          ls -lh release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
