// Top-level build file —— 方案 B（Android Shell）
buildscript {
    repositories {
        maven { url 'https://maven.cdn.bytedance.com/repository/google' }
        maven { url 'https://maven.cdn.bytedance.com/repository/public' }
        maven { url 'https://repo.huaweicloud.com/repository/google/' }
        maven { url 'https://repo.huaweicloud.com/repository/maven/' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.4.2 是 2024 Q2 稳定版，支持 Gradle 8.4~8.7、JDK 17~21；实测在 JDK25/Gradle8.14 也 OK
        classpath 'com.android.tools.build:gradle:8.4.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
    }
}
allprojects { tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' } }
tasks.register('clean', Delete) { delete rootProject.buildDir }
